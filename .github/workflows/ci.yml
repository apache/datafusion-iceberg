name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

# Cancel obsolete runs for the same pull request or branch. The three jobs below
# keep this workflow well below ASF's 15-job recommended concurrency limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# CI needs no credentials beyond reading the source tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache: "true"
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Incremental artifacts and debug info go unused in CI and only
      # add cache size and build time.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"
      - run: cargo test --workspace --locked
