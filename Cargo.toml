[workspace]
members = [
    "crates/datafusion",
    "crates/sqllogictest",
    "crates/playground",
]
resolver = "2"

[workspace.package]
edition = "2024"
homepage = "https://datafusion.apache.org"
license = "Apache-2.0"
repository = "https://github.com/apache/datafusion-iceberg"
version = "0.10.1"

[workspace.dependencies]
anyhow = "1.0.72"
async-trait = "0.1.89"
datafusion = "55.0.0"
datafusion-cli = "55.0.0"
datafusion-iceberg = { path = "crates/datafusion" }
datafusion-sqllogictest = "55.0.0"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "665c64e48e8d33797ecb1a421f327edd9b024879" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "665c64e48e8d33797ecb1a421f327edd9b024879" }
tokio = { version = "1.47", default-features = false, features = ["sync", "rt-multi-thread"] }
toml = "1.1"
tracing = "0.1.41"

[workspace.lints.rust]
unused_qualifications = "deny"
